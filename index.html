<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subscription Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-light: #f5f7fa;
      --bg-dark: #1e1e1e;
      --container-light: #ffffff;
      --container-dark: #2c2c2c;
      --text-light: #2c3e50;
      --text-dark: #f1f1f1;
      --table-head-light: #f0f3f7;
      --table-head-dark: #444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
      transition: all 0.3s ease;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    .container {
      max-width: 960px;
      margin: auto;
      background: var(--container-light);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }

    body.dark .container {
      background: var(--container-dark);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .dark-toggle {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    .dark-toggle button {
      background: #333;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    form, .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    input, select {
      flex: 1;
      padding: 12px 15px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.3s;
    }

    body.dark input, body.dark select {
      background-color: #444;
      color: white;
      border-color: #666;
    }

    button {
      padding: 12px 22px;
      background: #2ecc71;
      color: white;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #27ae60;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background-color: var(--table-head-light);
      color: var(--text-light);
      font-weight: 600;
      padding: 14px 12px;
      border-bottom: 2px solid #ccc;
      text-align: left;
    }

    body.dark th {
      background-color: var(--table-head-dark);
      color: var(--text-dark);
    }

    tr {
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    tr:hover {
      background-color: #e2f0ff;
      transform: scale(1.005);
    }

    body.dark tr:hover {
      background-color: #2e2e2e;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    body.dark td {
      border-bottom: 1px solid #555;
    }

    .action-btn {
      margin-right: 6px;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .edit-btn {
      background: #f1c40f;
      color: #fff;
    }

    .edit-btn:hover {
      background: #d4ac0d;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: white;
    }

    .Entertainment { background: #e67e22; }
    .Education { background: #2980b9; }
    .Utilities { background: #27ae60; }
    .Gaming { background: #9b59b6; }
    .Productivity { background: #16a085; }
    .Business { background: #34495e; }
    .Health { background: #c0392b; }
    .Others { background: #7f8c8d; }

    @media (max-width: 700px) {
      form, .controls {
        flex-direction: column;
      }
      input, select, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="dark-toggle">
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
  </div>

  <div class="container">
    <h1>📅 Subscription Tracker</h1>

    <form id="subscriptionForm">
      <input type="text" id="name" placeholder="Subscription Name" required>
      <input type="number" id="amount" placeholder="Monthly Cost (₹)" required>
      <input type="date" id="renewalDate" required>
      <select id="category" required>
        <option value="">Select Category</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Education">Education</option>
        <option value="Utilities">Utilities</option>
        <option value="Gaming">Gaming</option>
        <option value="Productivity">Productivity</option>
        <option value="Business">Business</option>
        <option value="Health">Health</option>
        <option value="Others">Others</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div class="controls">
      <input type="date" id="startDate" placeholder="Start Date">
      <input type="date" id="endDate" placeholder="End Date">
      <select id="sortBy">
        <option value="">Sort By</option>
        <option value="amount-asc">Amount ↑</option>
        <option value="amount-desc">Amount ↓</option>
        <option value="date-asc">Date ↑</option>
        <option value="date-desc">Date ↓</option>
        <option value="category">Category A-Z</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Amount (₹)</th>
          <th>Renewal Date</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="subscriptionTable"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('subscriptionForm');
    const nameInput = document.getElementById('name');
    const amountInput = document.getElementById('amount');
    const dateInput = document.getElementById('renewalDate');
    const categoryInput = document.getElementById('category');
    const tableBody = document.getElementById('subscriptionTable');
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const sortBy = document.getElementById('sortBy');

    let editIndex = -1;

    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }

    document.addEventListener("DOMContentLoaded", loadSubscriptions);
    form.addEventListener('submit', saveSubscription);
    startDate.addEventListener('change', loadSubscriptions);
    endDate.addEventListener('change', loadSubscriptions);
    sortBy.addEventListener('change', loadSubscriptions);

    function saveSubscription(e) {
      e.preventDefault();
      const newSub = {
        name: nameInput.value.trim(),
        amount: parseFloat(amountInput.value),
        date: dateInput.value,
        category: categoryInput.value
      };
      let data = JSON.parse(localStorage.getItem('subscriptions')) || [];

      if (editIndex >= 0) {
        data[editIndex] = newSub;
        editIndex = -1;
      } else {
        data.push(newSub);
      }

      localStorage.setItem('subscriptions', JSON.stringify(data));
      form.reset();
      loadSubscriptions();
    }

    function loadSubscriptions() {
      let data = JSON.parse(localStorage.getItem('subscriptions')) || [];

      const start = startDate.value;
      const end = endDate.value;

      if (start) data = data.filter(sub => sub.date >= start);
      if (end) data = data.filter(sub => sub.date <= end);

      switch (sortBy.value) {
        case "amount-asc":
          data.sort((a, b) => a.amount - b.amount);
          break;
        case "amount-desc":
          data.sort((a, b) => b.amount - a.amount);
          break;
        case "date-asc":
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          break;
        case "date-desc":
          data.sort((a, b) => new Date(b.date) - new Date(a.date));
          break;
        case "category":
          data.sort((a, b) => a.category.localeCompare(b.category));
          break;
      }

      tableBody.innerHTML = "";
      data.forEach((item, index) => {
        const row = document.createElement("tr");
        const categoryClass = item.category.replace(/\s|\//g, '').replace('&', '').replace(/[^a-zA-Z]/g, '');
        row.innerHTML = `
          <td>${item.name}</td>
          <td>₹${item.amount}</td>
          <td>${item.date}</td>
          <td><span class="badge ${categoryClass}">${item.category}</span></td>
          <td>
            <button class="action-btn edit-btn" onclick="editSubscription(${index})">Edit</button>
            <button class="action-btn delete-btn" onclick="deleteSubscription(${index})">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function editSubscription(index) {
      const data = JSON.parse(localStorage.getItem('subscriptions')) || [];
      const item = data[index];
      nameInput.value = item.name;
      amountInput.value = item.amount;
      dateInput.value = item.date;
      categoryInput.value = item.category;
      editIndex = index;
    }

    function deleteSubscription(index) {
      const data = JSON.parse(localStorage.getItem('subscriptions')) || [];
      data.splice(index, 1);
      localStorage.setItem('subscriptions', JSON.stringify(data));
      loadSubscriptions();
    }
  </script>
</body>
</html>
